/* Ray directions for the disc, in the *unrotated* view frame. Depends only on
   canvas geometry, so it is rebuilt on resize and reused every frame. */
const RAY = { scale: 0, w: 0, h: 0, nz: null, nx: null, ny: null, idx: null, buf: null, img: null };

function buildRays(scale) {
  const w = Math.max(1, Math.round(GW * scale)), h = Math.max(1, Math.round(GH * scale));
  const cx = GCX * scale, cy = GCY * scale, r = GR * scale;
  const n = w * h;
  const nz = new Float32Array(n), nx = new Float32Array(n), ny = new Float32Array(n);
  const idx = new Int32Array(n);
  let k = 0;
  for (let y = 0; y < h; y++) {
    const dy = (y + 0.5 - cy) / r;
    for (let x = 0; x < w; x++) {
      const dx = (x + 0.5 - cx) / r;
      const r2 = dx * dx + dy * dy;
      if (r2 > 1) continue;
      idx[k] = y * w + x;
      nx[k] = dx; ny[k] = -dy; nz[k] = Math.sqrt(1 - r2);
      k++;
    }
  }
  RAY.scale = scale; RAY.w = w; RAY.h = h;
  RAY.nz = nz; RAY.nx = nx; RAY.ny = ny; RAY.idx = idx; RAY.count = k;
  RAY.img = gx.createImageData(w, h);
  RAY.buf = new Uint32Array(RAY.img.data.buffer);
}

const INV_PI = 1 / Math.PI;

/* Per-pixel trig stays native.

   A lookup table for asin plus a polynomial atan2 measured ~19% faster in one
   interleaved test and ~20% slower in another; the two disagreed because
   routing the trig through closure parameters defeats inlining, so neither
   number was trustworthy. The atan2 polynomial was accurate to 0.04 px, but the
   asin table was out by 4.5 px — uniform sampling in z under-resolves near the
   poles, where asin steepens toward a singularity. Wrong, and not measurably
   faster, so it is gone. The responsiveness win is taken structurally below
   instead, where it can be measured end to end.
   ------------------------------------------------------------------------- */

const SURF = { canvas: null, ctx: null, key: '' };

function paintSatelliteCached(scale) {
  const key = `${S.rot.lam.toFixed(3)}|${S.rot.phi.toFixed(3)}|${GR.toFixed(1)}|${scale}|${GW}x${GH}`;
  if (SURF.key !== key || !SURF.canvas) {
    if (!paintSatellite(scale)) return false;
    SURF.key = key;
  }
  gx.imageSmoothingEnabled = true;
  gx.drawImage(SURF.canvas, 0, 0, SURF.canvas.width, SURF.canvas.height, 0, 0, GW, GH);
  return true;
}

/* Adaptive resolution.

   The projection cost is linear in pixel count and machines differ by an order
   of magnitude, so the scale is chosen from what a paint actually cost here
   rather than from a constant guessed on one laptop. Quantised to four steps so
   the surface cache is not thrashed by a scale that drifts every frame. */
let satFullMs = 16;                      // rolling estimate of a full-res paint;
                                         // starts pessimistic so the first drag is
                                         // coarse-and-smooth, then sharpens as it learns
const SAT_BUDGET_MS = 4.5;               // what we will spend while the globe moves
const SAT_STEPS = [0.34, 0.45, 0.6, 0.8, 1];
function movingScale() {
  const want = Math.sqrt(SAT_BUDGET_MS / Math.max(0.5, satFullMs));
  for (const st of SAT_STEPS) if (st >= want) return st;
  return 1;
}

function paintSatellite(scale) {
  if (!TEX.ready) return false;
  const _t0 = performance.now();
  if (RAY.scale !== scale || RAY.w !== Math.round(GW * scale)) buildRays(scale);
  const { nz, nx, ny, idx, buf, count } = RAY;
  const tw = TEX.w, th = TEX.h, td = TEX.data;
  const m0 = M[0], m1 = M[1], m2 = M[2], m3 = M[3], m4 = M[4],
        m5 = M[5], m6 = M[6], m7 = M[7], m8 = M[8];

  buf.fill(0);
  for (let i = 0; i < count; i++) {
    const a = nz[i], b = nx[i], c = ny[i];
    // M is orthonormal, so the inverse is the transpose: world = Mᵀ · view
    const px = m0 * a + m3 * b + m6 * c;
    const py = m1 * a + m4 * b + m7 * c;
    const pz = m2 * a + m5 * b + m8 * c;

    let u = (Math.atan2(py, px) * INV_PI + 1) * 0.5 * tw;
    let v = (0.5 - Math.asin(pz > 1 ? 1 : pz < -1 ? -1 : pz) * INV_PI) * th;
    u = u < 0 ? 0 : u >= tw ? tw - 1 : u | 0;
    v = v < 0 ? 0 : v >= th ? th - 1 : v | 0;
    const t = (v * tw + u) << 2;

    // Limb darkening: a sphere lit from the viewer still falls off at the rim.
    const sh = 0.45 + 0.55 * a;
    buf[idx[i]] = 0xff000000 |
      ((td[t + 2] * sh) << 16) |
      ((td[t + 1] * sh) << 8) |
      (td[t] * sh);
  }
  if (!SURF.canvas) {
    SURF.canvas = document.createElement('canvas');
    SURF.ctx = SURF.canvas.getContext('2d');
  }
  if (SURF.canvas.width !== RAY.w || SURF.canvas.height !== RAY.h) {
    SURF.canvas.width = RAY.w; SURF.canvas.height = RAY.h;
  }
  SURF.ctx.putImageData(RAY.img, 0, 0);
  // normalise to a full-res equivalent so the estimate is scale-independent
  satFullMs = satFullMs * 0.75 + ((performance.now() - _t0) / (scale * scale)) * 0.25;
  return true;
}

/* A thin blue shell just outside the limb, the way Earth reads from orbit. */
function paintAtmosphere() {
  const g = gx.createRadialGradient(GCX, GCY, GR * 0.985, GCX, GCY, GR * 1.10);
  g.addColorStop(0, 'rgba(126,186,232,0.55)');
  g.addColorStop(0.35, 'rgba(96,158,214,0.22)');
  g.addColorStop(1, 'rgba(70,130,190,0)');
  gx.beginPath();
  gx.arc(GCX, GCY, GR * 1.10, 0, 7);
  gx.fillStyle = g;
  gx.fill();
}

const M = new Float64Array(9);
function buildMatrix() {
  const l = S.rot.lam * Math.PI / 180, p = S.rot.phi * Math.PI / 180;
  const cl = Math.cos(l), sl = Math.sin(l), cp = Math.cos(p), sp = Math.sin(p);
  M[0] = cp * cl; M[1] = -cp * sl; M[2] = sp;      // depth row
  M[3] = sl;      M[4] = cl;       M[5] = 0;       // screen x row
  M[6] = -sp * cl; M[7] = sp * sl; M[8] = cp;      // screen y row
}

/* Graticule, built once as unit vectors. */
const GRAT = (() => {
  const out = [];
  for (let lon = -180; lon < 180; lon += 30) {
    const r = [];
    for (let lat = -90; lat <= 90; lat += 4) r.push(...unit(lat, lon));
    out.push(new Float64Array(r));
  }
  for (let lat = -60; lat <= 60; lat += 30) {
    const r = [];
    for (let lon = -180; lon <= 180; lon += 4) r.push(...unit(lat, lon));
    out.push(new Float64Array(r));
  }
  return out;
})();

/*
 * Size the backing store only — never write an inline width/height.
 *
 * The clamp below stops a zero measurement producing a zero-sized canvas, but
 * written as an inline style it becomes permanent: a page laid out while hidden
 * (a background tab, an artifact iframe before it is shown) measures 0, pins the
 * element at the 80px minimum, and stays an 80px globe in an 800px stage
 * forever after. CSS keeps the element at 100% of the stage; only the pixel
 * buffer is set here, and sizeGuard re-syncs it once real layout arrives.
 */
function resizeGlobe() {
  const w = gcv.clientWidth || gcv.parentElement.getBoundingClientRect().width;
  const h = gcv.clientHeight || gcv.parentElement.getBoundingClientRect().height;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  GW = Math.max(80, w); GH = Math.max(80, h);
  gcv.width = Math.round(GW * DPR); gcv.height = Math.round(GH * DPR);
  gx.setTransform(DPR, 0, 0, DPR, 0, 0);
  GCX = GW / 2; GCY = GH / 2;
  GR = Math.min(GW, GH) * 0.5 * ZOOMF;
  SURF.key = '';                       // the cached sphere is the wrong size now
}

/** Cheap per-frame check that the buffers still match the laid-out boxes. */
function sizeGuard() {
  const w = gcv.clientWidth, h = gcv.clientHeight;
  if (w > 0 && h > 0 && (Math.abs(w - GW) > 1 || Math.abs(h - GH) > 1)) {
    resizeGlobe(); resizeChron(); resizeRail();
    markAll();
    return true;
  }
  return false;
}

/* ------------------------------------------------------------ ring drawing */
/* Scratch buffers, sized to the largest ring, reused every frame. */
const RB = { d: null, Y: null, Z: null };
function ensureBuffers(n) {
  if (!RB.d || RB.d.length < n) {
    RB.d = new Float64Array(n * 2); RB.Y = new Float64Array(n * 2); RB.Z = new Float64Array(n * 2);
  }
}

function projectRing(ring) {
  const n = ring.length / 3;
  ensureBuffers(n);
  const { d, Y, Z } = RB;
  let nVis = 0;
  for (let i = 0; i < n; i++) {
    const px = ring[i * 3], py = ring[i * 3 + 1], pz = ring[i * 3 + 2];
    d[i] = M[0] * px + M[1] * py + M[2] * pz;
    Y[i] = M[3] * px + M[4] * py + M[5] * pz;
    Z[i] = M[6] * px + M[7] * py + M[8] * pz;
    if (d[i] > 0) nVis++;
  }
  return { n, nVis };
}

/*
 * Which way round the limb does a gap close?
 *
 * Not a question the hidden vertices can answer. Their azimuths wind through
 * extra whole turns on a ring as long as Eurasia, and on a ring as small as a
 * Siberian lake they are identical to within rounding — either way the sign is
 * junk and the arc sweeps the wrong way, flooding the disc.
 *
 * It follows from orientation instead. Walking the limb in the direction of
 * increasing azimuth in the right-handed view frame keeps the visible
 * hemisphere on the left; a ring whose interior is also on its left therefore
 * closes that same way, at every gap, regardless of how much is hidden. The
 * matrix rows are a right-handed triple, and screen angle is atan2(-Z, Y),
 * which runs opposite to that azimuth — hence canvas counterclockwise.
 */
function limbSweepIsCCW(orientation) { return orientation > 0; }

/* Open polylines — graticule, plate boundaries. Hidden runs are simply cut,
   never bridged, so nothing smears across the disc. */
function strokePolyline(ring) {
  const { n } = projectRing(ring);
  const { d, Y, Z } = RB;
  let drawing = false, drew = false;
  gx.beginPath();
  for (let i = 0; i < n; i++) {
    if (d[i] > 0) {
      const sx = GCX + GR * Y[i], sy = GCY - GR * Z[i];
      if (!drawing) { gx.moveTo(sx, sy); drawing = true; } else gx.lineTo(sx, sy);
      drew = true;
    } else drawing = false;
  }
  if (drew) gx.stroke();
  return drew;
}

/**
 * Filled landmasses, clipped to the visible hemisphere.
 *
 * Collapsing hidden vertices onto the rim (the cheap trick) turns any continent
 * straddling the horizon into a polygon that swallows the globe. Instead: cut
 * the ring at the horizon, then close each gap by following the limb itself,
 * choosing the sweep direction that passes over where the hidden vertices
 * actually went. Fill the closed path, then stroke only the true coastline so
 * the limb arcs are not mistaken for shoreline.
 */
function drawLandRing(ring, orientation) {
  const { n, nVis } = projectRing(ring);
  if (nVis === 0) return false;
  const { d, Y, Z } = RB;

  if (nVis === n) {
    gx.beginPath();
    for (let i = 0; i < n; i++) {
      const sx = GCX + GR * Y[i], sy = GCY - GR * Z[i];
      if (i === 0) gx.moveTo(sx, sy); else gx.lineTo(sx, sy);
    }
    gx.closePath(); gx.fill(); gx.stroke();
    return true;
  }

  let start = -1;
  for (let i = 0; i < n; i++) if (d[i] <= 0 && d[(i + 1) % n] > 0) { start = i; break; }
  if (start < 0) return false;

  const cross = (i, j) => {
    const t = d[i] / (d[i] - d[j]);
    let y = Y[i] + (Y[j] - Y[i]) * t, z = Z[i] + (Z[j] - Z[i]) * t;
    const m = Math.hypot(y, z) || 1;
    return [y / m, z / m];
  };

  const segs = [];
  let cur = null;
  for (let k = 0; k < n; k++) {
    const i = (start + k) % n, j = (start + k + 1) % n;
    if (d[i] > 0) {
      if (!cur) { cur = { pts: [], inAng: null }; segs.push(cur); }
      cur.pts.push(Y[i], Z[i]);
      if (d[j] <= 0) {
        const c = cross(i, j);
        cur.pts.push(c[0], c[1]);
        cur.outAng = Math.atan2(-c[1], c[0]);
        cur = null;
      }
    } else if (d[j] > 0) {
      const c = cross(i, j);
      cur = { pts: [c[0], c[1]], inAng: Math.atan2(-c[1], c[0]) };
      segs.push(cur);
    }
  }
  const chains = segs.filter(s => s.inAng != null && s.outAng != null);
  if (!chains.length) return false;
  const ccw = limbSweepIsCCW(orientation);

  /* Chains must be re-paired by position along the limb, not by ring order.
     Where a coastline crosses the horizon many times, the chain that follows
     another around the rim is rarely the next one in the ring; pairing by ring
     order crosses the arcs over each other and the fill inverts. */
  const TAU = Math.PI * 2;
  const gapTo = (from, to) => {
    const d = ccw ? (from - to) : (to - from);
    return ((d % TAU) + TAU) % TAU;
  };

  const used = new Array(chains.length).fill(false);
  gx.beginPath();
  for (let s0 = 0; s0 < chains.length; s0++) {
    if (used[s0]) continue;
    let cur = s0, first = true, guard = 0;
    while (guard++ <= chains.length) {
      used[cur] = true;
      const seg = chains[cur];
      for (let q = 0; q < seg.pts.length; q += 2) {
        const sx = GCX + GR * seg.pts[q], sy = GCY - GR * seg.pts[q + 1];
        if (first && q === 0) gx.moveTo(sx, sy); else gx.lineTo(sx, sy);
      }
      first = false;
      let best = -1, bestD = Infinity;
      for (let t = 0; t < chains.length; t++) {
        const d2 = gapTo(seg.outAng, chains[t].inAng);
        if (d2 < bestD - 1e-12) { bestD = d2; best = t; }
      }
      if (best < 0) break;
      gx.arc(GCX, GCY, GR, seg.outAng, chains[best].inAng, ccw);
      if (best === s0 || used[best]) break;
      cur = best;
    }
    gx.closePath();
  }
  gx.fill();

  // coastline only — the limb arcs above are a fill device, not shoreline
  gx.beginPath();
  for (const seg of chains) {
    for (let q = 0; q < seg.pts.length; q += 2) {
      const sx = GCX + GR * seg.pts[q], sy = GCY - GR * seg.pts[q + 1];
      if (q === 0) gx.moveTo(sx, sy); else gx.lineTo(sx, sy);
    }
  }
  gx.stroke();
  return true;
}

/* --------------------------------------------------------------- great arcs */
function arcPoints(a, b, steps) {
  let dot = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  dot = Math.max(-1, Math.min(1, dot));
  const om = Math.acos(dot), so = Math.sin(om);
  const pts = new Float64Array(steps * 3);
  for (let i = 0; i < steps; i++) {
    const t = i / (steps - 1);
    let c1, c2;
    if (so < 1e-6) { c1 = 1 - t; c2 = t; }
    else { c1 = Math.sin((1 - t) * om) / so; c2 = Math.sin(t * om) / so; }
    pts[i * 3] = a[0] * c1 + b[0] * c2;
    pts[i * 3 + 1] = a[1] * c1 + b[1] * c2;
    pts[i * 3 + 2] = a[2] * c1 + b[2] * c2;
  }
  return pts;
}

/** Draw an arc raised off the surface; returns screen points for the travelling dot. */
function drawArc(pts, lift, color, width, dash, dashOffset) {
  const n = pts.length / 3;
  gx.strokeStyle = color; gx.lineWidth = width;
  if (dash) { gx.setLineDash(dash); gx.lineDashOffset = dashOffset || 0; }
  const screen = new Float64Array(n * 2);
  const vis = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const h = 1 + lift * Math.sin(Math.PI * t);
    const px = pts[i * 3], py = pts[i * 3 + 1], pz = pts[i * 3 + 2];
    const d = M[0] * px + M[1] * py + M[2] * pz;
    const yv = M[3] * px + M[4] * py + M[5] * pz;
    const zv = M[6] * px + M[7] * py + M[8] * pz;
    screen[i * 2] = GCX + GR * h * yv;
    screen[i * 2 + 1] = GCY - GR * h * zv;
    vis[i] = d > -(h - 1) * 0.9 ? 1 : 0;
  }
  let drawing = false;
  gx.beginPath();
  for (let i = 0; i < n; i++) {
    if (vis[i]) {
      if (!drawing) { gx.moveTo(screen[i * 2], screen[i * 2 + 1]); drawing = true; }
      else gx.lineTo(screen[i * 2], screen[i * 2 + 1]);
    } else drawing = false;
  }
  gx.stroke();
  gx.setLineDash([]);
  return { screen, vis, n };
}

/* ------------------------------------------------------------------ markers */
/* Hit targets are parallel typed arrays in 45_markers.js and are rebuilt inside
   drawEvents; ask hitTest(x, y) for what is under the cursor. */

/* drawMarker and drawLabel came over with the globe from the sibling site,
   where markers are claims rather than events. Nothing here called them, and
   drawMarker's markerRadius(sig) was in fact resolving to the two-argument
   markerRadius in 45_markers.js - later declarations in the same script win -
   so it would have drawn the wrong size the moment anything did call it. */

/* ------------------------------------------------------------------- render */
let arcPhase = 0;
let ON_IMAGERY = false;
let LAST_INPUT_AT = -1e9;   // set by the input handlers; see paintOnInput   // label scrims darken over satellite imagery

function drawGlobe(dt) {
  buildMatrix();
  gx.clearRect(0, 0, GW, GH);

  const moving = !!gDrag || Math.abs(S.spin.lam) > 0.01 || Math.abs(S.spin.phi) > 0.01
    || (performance.now() - LAST_INPUT_AT) < 170;
  const satellite = S.basemap === 'satellite' && TEX.ready;
  ON_IMAGERY = satellite;

  if (satellite) {
    paintAtmosphere();
    paintSatelliteCached(moving ? movingScale() : 1);
  } else {
    const grd = gx.createRadialGradient(GCX - GR * 0.3, GCY - GR * 0.35, GR * 0.1, GCX, GCY, GR);
    grd.addColorStop(0, CSSV['ocean-hi']); grd.addColorStop(1, CSSV['ocean-lo']);
    gx.beginPath(); gx.arc(GCX, GCY, GR, 0, 7); gx.fillStyle = grd; gx.fill();
  }

  gx.save();
  gx.beginPath(); gx.arc(GCX, GCY, GR, 0, 7); gx.clip();

  // graticule
  gx.strokeStyle = satellite ? 'rgba(255,255,255,0.13)' : withAlpha(CSSV['land-edge'], 0.16);
  gx.lineWidth = 0.5;
  for (const g of GRAT) strokePolyline(g);

  // coastlines: the whole basemap in chart mode, nothing at all over imagery
  if (!satellite) {
    gx.fillStyle = CSSV.land; gx.strokeStyle = CSSV['land-edge']; gx.lineWidth = 0.7;
    for (let i = 0; i < LAND.length; i++) drawLandRing(LAND[i], LAND_CCW[i]);
  }

  // plate boundaries — a geological-survey underlay, drawn over the land it cuts
  if (S.showPlates) {
    gx.strokeStyle = satellite ? 'rgba(255,196,120,0.62)' : CSSV.plate;
    gx.lineWidth = satellite ? 1.1 : 0.9;
    gx.setLineDash([3, 2.5]);
    for (const p of PLATE) strokePolyline(p);
    gx.setLineDash([]);
  }

  gx.restore();

  // limb
  gx.beginPath(); gx.arc(GCX, GCY, GR, 0, 7);
  gx.strokeStyle = satellite ? 'rgba(150,200,240,0.5)' : withAlpha(CSSV['land-edge'], 0.7);
  gx.lineWidth = 1; gx.stroke();

  drawEvents();

  if (!RM.matches) arcPhase += dt;
}

/* ============================================================================
   EVENTS ON THE GLOBE

   This is the only code in the site that runs per frame over the whole corpus,
   and the corpus grew by a factor of five. The old version pushed one object per
   visible event per frame and then a second one per cluster; at seven thousand
   events that was invisible, at forty thousand it is tens of thousands of short-
   lived objects sixty times a second, which is a garbage collector pause you can
   feel in the middle of a drag.

   So everything here is parallel typed arrays, allocated once and grown by
   doubling. Nothing in the frame path allocates. The object array EV still
   exists and is still what the panels and the histogram read - those run once
   per state change, where a plain object is worth far more than a byte saved.
   ========================================================================== */

function markerRadius(n, sl) {
  if (n > 1) return Math.min(15, 4 + Math.log2(n) * 2.4);
  return 2.4 + Math.min(6, Math.log2(1 + sl) * 0.95);
}

/* ------------------------------------------------- projected points (scratch) */
let PX = new Float32Array(0), PY = new Float32Array(0), PD = new Float32Array(0);
let PI = new Int32Array(0);
/* ------------------------------------------------------- drawable groups */
let GX = new Float32Array(0), GY = new Float32Array(0), GD = new Float32Array(0);
let GI = new Int32Array(0), GN = new Uint32Array(0), GMIX = new Uint8Array(0);
let GORD = new Int32Array(0);
let NG = 0;

function grow(n) {
  if (PX.length >= n) return;
  const k = Math.max(2048, 1 << Math.ceil(Math.log2(n)));
  PX = new Float32Array(k); PY = new Float32Array(k); PD = new Float32Array(k);
  PI = new Int32Array(k);
  GX = new Float32Array(k); GY = new Float32Array(k); GD = new Float32Array(k);
  GI = new Int32Array(k); GN = new Uint32Array(k); GMIX = new Uint8Array(k);
  GORD = new Int32Array(k);
}

/* ---------------------------------------------------------------- clustering
   Forty thousand points on a globe is confetti. Bin in screen space and draw one
   marker per occupied cell, sized by how many fell into it, so density reads as
   density instead of as an unreadable smear. The most-covered event in each cell
   supplies the label and the click target - the cell stands for something real
   rather than for a centroid nobody chose. */
const BINS = new Map();
function clusterInto(m, cell) {
  BINS.clear();
  for (let k = 0; k < m; k++) {
    const key = ((PX[k] / cell) | 0) * 4093 + ((PY[k] / cell) | 0);
    const b = BINS.get(key);
    if (b === undefined) {
      BINS.set(key, [1, PX[k], PY[k], PI[k], PD[k], THEME_IX[EV[PI[k]].theme]]);
    } else {
      b[0]++; b[1] += PX[k]; b[2] += PY[k];
      if (EVSL[PI[k]] > EVSL[b[3]]) { b[3] = PI[k]; b[4] = PD[k]; }
      if (b[5] >= 0 && b[5] !== THEME_IX[EV[PI[k]].theme]) b[5] = -1;
    }
  }
  let g = 0;
  for (const b of BINS.values()) {
    GN[g] = b[0];
    GX[g] = b[0] === 1 ? b[1] : b[1] / b[0];
    GY[g] = b[0] === 1 ? b[2] : b[2] / b[0];
    GI[g] = b[3]; GD[g] = b[4]; GMIX[g] = b[5] < 0 ? 1 : 0;
    g++;
  }
  return g;
}

/* --------------------------------------------------------------- hit testing
   Also arrays. The hover handler runs this on every pointermove, so the cheap
   box rejection before the hypot is not premature - it is the difference
   between 0.1 ms and 2 ms on a corpus this size. */
let HX = new Float32Array(0), HY = new Float32Array(0), HR = new Float32Array(0);
let HI = new Int32Array(0), HC = new Uint32Array(0);
let HN = 0;

function hitTest(mx, my) {
  let best = -1, bd = 1e9;
  for (let k = 0; k < HN; k++) {
    const r = HR[k];
    const dx = HX[k] - mx; if (dx > r || dx < -r) continue;
    const dy = HY[k] - my; if (dy > r || dy < -r) continue;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < r && d < bd) { bd = d; best = k; }
  }
  if (best < 0) return null;
  return { id: EV[HI[best]].q, i: HI[best], x: HX[best], y: HY[best], n: HC[best] };
}

function drawEvents() {
  const F = q();
  const src = F.idx, N = F.n;
  grow(Math.max(N, 2048));
  if (HX.length < PX.length) {
    HX = new Float32Array(PX.length); HY = new Float32Array(PX.length);
    HR = new Float32Array(PX.length); HI = new Int32Array(PX.length);
    HC = new Uint32Array(PX.length);
  }

  const m0 = M[0], m1 = M[1], m2 = M[2], m3 = M[3], m4 = M[4],
        m5 = M[5], m6 = M[6], m7 = M[7], m8 = M[8];

  let m = 0;
  for (let k = 0; k < N; k++) {
    const i = src[k];
    const x = EVX[i], y = EVYV[i], z = EVZ[i];
    const d = m0 * x + m1 * y + m2 * z;
    if (d <= 0.015) continue;                        // behind the limb
    PI[m] = i; PD[m] = d;
    PX[m] = GCX + GR * (m3 * x + m4 * y + m5 * z);
    PY[m] = GCY - GR * (m6 * x + m7 * y + m8 * z);
    m++;
  }

  if (S.cluster) {
    NG = clusterInto(m, Math.max(15, GR * 0.055));
  } else {
    NG = m;
    for (let k = 0; k < m; k++) {
      GX[k] = PX[k]; GY[k] = PY[k]; GD[k] = PD[k]; GI[k] = PI[k];
      GN[k] = 1; GMIX[k] = 0;
    }
  }

  /* Painter's order, but only while sorting is cheap. Unclustered at full
     corpus there are tens of thousands of near-identical dots and the overdraw
     order is not perceptible, whereas a comparator sort over them is 10 ms. */
  for (let k = 0; k < NG; k++) GORD[k] = k;
  let ord = GORD.subarray(0, NG);
  if (NG <= 3000) ord = ord.sort((a, b) => GD[a] - GD[b]);

  HN = 0;
  gx.save();
  for (let oi = 0; oi < NG; oi++) {
    const k = ord[oi];
    const i = GI[k], n = GN[k];
    const e = EV[i];
    const col = CSSV[e.theme] || CSSV.chalk;
    const r = markerRadius(n, EVSL[i]);
    const sx = GX[k], sy = GY[k];

    // dark contact ring: a theme colour can otherwise land on sunlit desert
    // at its own value and vanish
    gx.beginPath(); gx.arc(sx, sy, r + 1.5, 0, 7);
    gx.fillStyle = 'rgba(4,8,14,0.5)'; gx.fill();

    gx.beginPath(); gx.arc(sx, sy, r, 0, 7);
    if (n > 1) {
      gx.fillStyle = withAlpha(GMIX[k] ? CSSV['chalk-dim'] : col, 0.7);
      gx.fill();
      gx.strokeStyle = withAlpha(GMIX[k] ? CSSV.chalk : col, 0.9);
      gx.lineWidth = 1.1; gx.stroke();
    } else {
      gx.fillStyle = col; gx.fill();
    }

    if (S.selection === e.q) {
      gx.beginPath(); gx.arc(sx, sy, r + 5, 0, 7);
      gx.strokeStyle = CSSV.chalk; gx.lineWidth = 1.3; gx.stroke();
    }

    HX[HN] = sx; HY[HN] = sy; HR[HN] = r + 6; HI[HN] = i; HC[HN] = n; HN++;
  }

  // counts inside the bigger clusters
  gx.font = `600 9px xt-mono, monospace`;
  gx.textAlign = 'center'; gx.textBaseline = 'middle';
  for (let k = 0; k < NG; k++) {
    if (GN[k] < 4) continue;
    if (markerRadius(GN[k], EVSL[GI[k]]) < 8) continue;
    gx.fillStyle = 'rgba(6,10,16,0.85)';
    gx.fillText(String(GN[k]), GX[k], GY[k] + 0.5);
  }
  gx.textAlign = 'start'; gx.textBaseline = 'alphabetic';

  // labels: only the singles, only the well-covered, only where they fit
  const cands = [];
  for (let k = 0; k < NG; k++) {
    if (GN[k] === 1 || EVSL[GI[k]] > 80) cands.push(k);
  }
  const rank = k => (EV[GI[k]].q === S.selection ? 1e9 : EVSL[GI[k]]);
  cands.sort((a, b) => rank(b) - rank(a));
  const labelled = cands.slice(0, 34);

  const boxes = [];
  gx.font = `400 11px xt-cond, sans-serif`;
  for (const k of labelled) {
    const e = EV[GI[k]];
    const strong = e.q === S.selection || e.q === S.hover;
    if (!strong && EVSL[GI[k]] < 90) continue;
    const t = e.n;
    const w = gx.measureText(t).width;
    const r = markerRadius(GN[k], EVSL[GI[k]]);
    const sx = GX[k], sy = GY[k];
    for (const [bx, by] of [[sx + r + 5, sy + 4], [sx - w - r - 5, sy + 4],
                            [sx - w / 2, sy - r - 6], [sx - w / 2, sy + r + 13]]) {
      const box = [bx - 2, by - 10, w + 4, 13];
      if (bx < 4 || bx + w > GW - 4 || by < 12 || by > GH - 6) continue;
      let hit = false;
      for (const o of boxes) {
        if (box[0] < o[0] + o[2] && box[0] + box[2] > o[0] &&
            box[1] < o[1] + o[3] && box[1] + box[3] > o[1]) { hit = true; break; }
      }
      if (hit) continue;
      boxes.push(box);
      gx.fillStyle = 'rgba(6,10,16,0.66)';
      gx.fillRect(box[0], box[1], box[2], box[3]);
      gx.fillStyle = strong ? '#F4F0E8' : withAlpha(CSSV[e.theme] || CSSV.chalk, 0.95);
      gx.font = `${strong ? 600 : 400} 11px xt-cond, sans-serif`;
      gx.fillText(t, bx, by);
      break;
    }
  }
  gx.restore();
}

/* ============================================================================
   TIME AXIS + PERIOD RIBBON + EVENT DENSITY
   The sibling site's signature was the stratigraphic ribbon in real ICS colours.
   The equivalent here is a histogram of the record itself: how many events
   survive, century by century. It shows the shape of what is remembered, which
   is the honest thing this corpus is actually about.
   ========================================================================== */

const ccv = document.getElementById('chroncv');
const cx2 = ccv.getContext('2d');

const TICK_H = 17, HIST_H = 56, ERA_H = 15, CENT_H = 12;
const CH_H = TICK_H + HIST_H + ERA_H + CENT_H + 4;
let CW = 0, SCALE = null;

function resizeChron() {
  CW = Math.max(120, ccv.clientWidth || ccv.parentElement.getBoundingClientRect().width);
  ccv.width = Math.round(CW * DPR); ccv.height = Math.round(CH_H * DPR);
  ccv.style.height = CH_H + 'px';
  cx2.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function chronScale() { return makeScale(S.win.t0, S.win.t1, CW); }

function tickValues(t0, t1) {
  const out = [];
  const p0 = Math.floor(Math.log10(Math.max(t0, 1))), p1 = Math.ceil(Math.log10(t1));
  for (let p = p0; p <= p1; p++)
    for (const m of [1, 2, 5]) {
      const v = m * Math.pow(10, p);
      if (v >= t0 && v <= t1) out.push(v);
    }
  if (t0 <= 0) out.push(0);
  return out.sort((a, b) => b - a);
}

function drawBandLane(sc, rows, y, h, dark) {
  for (const iv of rows) {
    if (iv.e > S.win.t1 || iv.b < S.win.t0) continue;
    const x0 = Math.max(-2, sc.x(Math.min(iv.b, S.win.t1)));
    const x1 = Math.min(CW + 2, sc.x(Math.max(iv.e, S.win.t0)));
    const w = x1 - x0;
    if (w < 0.4) continue;
    cx2.fillStyle = iv.c;
    cx2.fillRect(x0, y, Math.max(w, 0.6), h - 1);
    if (w > 5) {
      cx2.strokeStyle = 'rgba(0,0,0,0.3)'; cx2.lineWidth = 0.5;
      cx2.beginPath(); cx2.moveTo(x0 + .25, y); cx2.lineTo(x0 + .25, y + h - 1); cx2.stroke();
    }
    if (w > 26) {
      cx2.font = `600 9px xt-cond, sans-serif`;
      const tw = cx2.measureText(iv.n).width;
      if (tw + 8 < w) {
        cx2.fillStyle = dark ? 'rgba(236,230,220,0.85)' : 'rgba(14,12,10,0.82)';
        cx2.fillText(iv.n, x0 + (w - tw) / 2, y + h - 4);
      }
    }
  }
}

/* Histogram of surviving events per column — the shape of the record. */
function drawHistogram(sc, yTop, h) {
  const F = q();
  const cols = Math.max(40, Math.floor(CW / 4));
  const bins = new Float64Array(cols);
  const binsTheme = THEMES.map(() => new Float64Array(cols));
  for (const e of F.events) {
    const x = sc.x(e.t);
    if (x < 0 || x >= CW) continue;
    const b = Math.min(cols - 1, Math.floor(x / CW * cols));
    bins[b]++;
    binsTheme[THEMES.indexOf(e.theme)][b]++;
  }
  let max = 0; for (const v of bins) max = Math.max(max, v);
  if (max <= 0) {
    cx2.fillStyle = CSSV['chalk-faint'];
    cx2.font = '400 11px xt-sans, sans-serif';
    cx2.fillText('nothing in this window at this coverage', 12, yTop + h / 2);
    return;
  }
  const bw = CW / cols;
  for (let b = 0; b < cols; b++) {
    if (!bins[b]) continue;
    let acc = 0;
    for (let ti = 0; ti < THEMES.length; ti++) {
      const v = binsTheme[ti][b];
      if (!v) continue;
      const hh = (v / max) * (h - 6);
      cx2.fillStyle = withAlpha(CSSV[THEMES[ti]], 0.88);
      cx2.fillRect(b * bw, yTop + h - 3 - acc - hh, Math.max(bw - 0.5, 0.8), hh);
      acc += hh;
    }
  }
  cx2.fillStyle = CSSV['chalk-faint'];
  cx2.font = '400 9px xt-mono, monospace';
  cx2.fillText(`${max} events at the peak`, 6, yTop + 10);
}

function drawChron() {
  const sc = SCALE = chronScale();
  cx2.clearRect(0, 0, CW, CH_H);

  cx2.font = '400 9.5px xt-mono, monospace';
  let lastX = -999;
  for (const t of tickValues(S.win.t0, S.win.t1)) {
    const x = sc.x(t);
    if (x < 2 || x > CW - 2) continue;
    cx2.strokeStyle = withAlpha(CSSV['chalk-faint'], 0.3);
    cx2.beginPath(); cx2.moveTo(x, TICK_H - 5); cx2.lineTo(x, TICK_H); cx2.stroke();
    const lab = fmtYbpLabel(t);
    const w = cx2.measureText(lab).width;
    if (x - w / 2 > lastX + 8 && x + w / 2 < CW - 2) {
      cx2.fillStyle = CSSV['chalk-faint'];
      cx2.fillText(lab, x - w / 2, TICK_H - 7);
      lastX = x + w / 2;
    }
  }

  drawHistogram(sc, TICK_H, HIST_H);

  let y = TICK_H + HIST_H;
  drawBandLane(sc, ERAS, y, ERA_H, false);
  drawBandLane(sc, CENTURIES, y + ERA_H, CENT_H, true);

  cx2.strokeStyle = CSSV.rule; cx2.lineWidth = 1;
  cx2.beginPath(); cx2.moveTo(0, y + .5); cx2.lineTo(CW, y + .5); cx2.stroke();

  if (S.selection && BY_Q[S.selection]) {
    const x = sc.x(BY_Q[S.selection].t);
    if (x >= -1 && x <= CW + 1) {
      cx2.strokeStyle = CSSV.amber; cx2.lineWidth = 1;
      cx2.beginPath(); cx2.moveTo(x + .5, 0); cx2.lineTo(x + .5, CH_H); cx2.stroke();
    }
  }
}

/* ============================================================================
   THE COVERAGE RAIL
   Perpendicular to the time axis, in the one accent colour reserved for it —
   the same move the sibling site makes with knowledge-time, asking a question
   this data can actually answer. Not "when did we come to believe this?" but
   "how much of the world remembers it?"
   ========================================================================== */

const rcv = document.getElementById('railcv');
const rx = rcv.getContext('2d');
let RW = 0, RH = 0;
const RPAD = 18;

function resizeRail() {
  RW = Math.max(40, rcv.clientWidth || rcv.getBoundingClientRect().width);
  RH = Math.max(80, rcv.clientHeight || rcv.getBoundingClientRect().height);
  rcv.width = Math.round(RW * DPR); rcv.height = Math.round(RH * DPR);
  rx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* Sitelink counts are heavy-tailed — half the corpus sits under 27 editions and
   the top is near 300 — so the rail is logarithmic or the whole scale is spent
   on a handful of capitals. */
const railU = n => Math.log(Math.max(1, n));
const RAIL_MAX = () => railU(MAX_SL);
function slToY(n) { return RPAD + (1 - railU(n) / RAIL_MAX()) * (RH - RPAD * 2); }
function yToSl(y) {
  const f = 1 - (y - RPAD) / (RH - RPAD * 2);
  return Math.round(Math.exp(Math.max(0, Math.min(1, f)) * RAIL_MAX()));
}

/* How many events survive each coverage floor, precomputed once. */
const SURVIVORS = (() => {
  const counts = new Array(MAX_SL + 2).fill(0);
  for (const e of EV) counts[Math.min(e.sl, MAX_SL)]++;
  const cum = new Array(MAX_SL + 2).fill(0);
  let run = 0;
  for (let n = MAX_SL; n >= 1; n--) { run += counts[n]; cum[n] = run; }
  return cum;
})();
const survivorsAt = n => SURVIVORS[Math.max(1, Math.min(MAX_SL, n))] || 0;

function drawRail() {
  rx.clearRect(0, 0, RW, RH);
  const spine = RW * 0.60;
  const y = slToY(S.kt);

  // the excluded band, greyed
  rx.fillStyle = withAlpha(CSSV['chalk-faint'], 0.07);
  rx.fillRect(0, y, RW, RH - y);

  // how many events survive at each height: the shape of notability
  const maxN = EV.length;
  for (let py = RPAD; py < RH - RPAD; py += 2) {
    const n = survivorsAt(yToSl(py));
    const w = (n / maxN) * (RW * 0.52);
    rx.fillStyle = withAlpha(py <= y ? CSSV.amber : CSSV['chalk-faint'], py <= y ? 0.45 : 0.16);
    rx.fillRect(spine - w, py, w, 1.4);
  }

  rx.strokeStyle = withAlpha(CSSV.amber, 0.35); rx.lineWidth = 1;
  rx.beginPath(); rx.moveTo(spine + .5, RPAD); rx.lineTo(spine + .5, RH - RPAD); rx.stroke();

  rx.font = '400 9px xt-mono, monospace';
  for (const n of [1, 3, 10, 30, 100, 300]) {
    if (n > MAX_SL) continue;
    const py = slToY(n);
    rx.strokeStyle = withAlpha(CSSV['chalk-faint'], 0.45);
    rx.beginPath(); rx.moveTo(spine + .5, py); rx.lineTo(spine + 5, py); rx.stroke();
    rx.fillStyle = CSSV['chalk-faint'];
    rx.fillText(String(n), spine + 8, py + 3);
  }

  rx.strokeStyle = CSSV.amber; rx.lineWidth = 1.6;
  rx.beginPath(); rx.moveTo(2, y + .5); rx.lineTo(RW - 2, y + .5); rx.stroke();
  rx.beginPath(); rx.arc(spine + .5, y + .5, 4.5, 0, 7);
  rx.fillStyle = CSSV.amber; rx.fill();
  rx.strokeStyle = CSSV.panel; rx.lineWidth = 1.5; rx.stroke();
}

/* ============================================================================
   PANELS
   ========================================================================== */
const elDetail = document.getElementById('detail');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function langList(e) {
  const have = [], missing = [];
  for (const l of LANGS) ((e.m & LANG_BIT[l]) ? have : missing).push(l);
  return { have, missing };
}

function renderDetail() {
  const F = q();
  if (!S.selection || !BY_Q[S.selection]) {
    const top = F.events.slice().sort((a, b) => b.sl - a.sl).slice(0, 6);
    // Sorted, not sliced raw: the corpus arrives in year order now, so an
    // unsorted slice would quietly become "the five oldest" instead of "the
    // five best-covered that English has no article for".
    const thin = F.events.filter(e => !(e.m & LANG_BIT.en))
      .sort((a, b) => b.sl - a.sl).slice(0, 5);
    elDetail.innerHTML = `
      <div class="empty">
        <strong>Nothing selected</strong>
        Click a marker. Clusters split as you zoom the globe.
        ${top.length ? `<p style="margin-top:14px"><strong>Most widely remembered here</strong></p>
          <ol>${top.map(e => `<li><button class="pick" data-q="${e.q}">${esc(e.n)}</button>
            <span class="num" style="color:var(--chalk-faint)"> ${fmtYear(e.y)} · ${e.sl} langs</span></li>`).join('')}</ol>` : ''}
        ${thin.length ? `<p style="margin-top:14px"><strong>In this window, but not on English Wikipedia</strong></p>
          <ol>${thin.map(e => `<li><button class="pick" data-q="${e.q}">${esc(e.n)}</button>
            <span class="num" style="color:var(--chalk-faint)"> ${fmtYear(e.y)} · ${e.sl} langs</span></li>`).join('')}</ol>` : ''}
      </div>`;
    return;
  }

  const e = BY_Q[S.selection];
  const { have, missing } = langList(e);
  const pct = Math.round(100 * have.length / LANGS.length);
  // nearest in time, within the same window
  const near = F.events
    .filter(x => x.q !== e.q)
    .sort((a, b) => Math.abs(a.y - e.y) - Math.abs(b.y - e.y))
    .slice(0, 6);

  elDetail.innerHTML = `
    <div class="dt-head">
      <span class="tag" style="color:${CSSV[e.theme]};border-color:${withAlpha(CSSV[e.theme], .45)}">
        ${esc(CAT_LABEL[e.c] || e.c)}</span>
      <h2>${esc(e.n)}</h2>
      <div class="when num">${fmtYear(e.y)}</div>
      <div class="where num">${e.lat.toFixed(3)}°, ${e.lng.toFixed(3)}°</div>
    </div>

    <div class="sect">
      <span class="lbl">Who remembers it</span>
      <div class="num" style="font-size:15px;color:var(--amber)">${e.sl} language editions</div>
      <div class="langbar"><i style="width:${pct}%"></i></div>
      <div class="langs">
        ${have.map(l => `<span>${l}</span>`).join('')}
        ${missing.slice(0, 12).map(l => `<span class="miss">${l}</span>`).join('')}
      </div>
      <p class="hint">Struck-through codes are major editions with no article on this.
        ${!(e.m & LANG_BIT.en) ? '<b style="color:var(--amber)">No English article.</b>' : ''}</p>
    </div>

    <div class="sect">
      <span class="lbl">Source</span>
      <p class="srcline">
        <a href="https://www.wikidata.org/wiki/${e.q}" target="_blank" rel="noopener">Wikidata ${e.q}</a>
        — date and coordinates as recorded there.
      </p>
      <p class="hint">This site cites the encyclopedia, not a primary source per row.
        For a battle or a cathedral that is a fair thing to cite; for a contested
        radiometric date it would not be, which is why the sibling site works differently.</p>
    </div>

    ${near.length ? `<div class="sect nearby">
      <span class="lbl">Nearest in time</span>
      ${near.map(x => `<button class="pick" data-q="${x.q}">
        <span class="y num">${fmtYear(x.y)}</span>
        <span class="t">${esc(x.n)}</span></button>`).join('')}
    </div>` : ''}`;
}

function renderThemes() {
  const F = q();
  document.getElementById('themes').innerHTML = THEMES.map(t => `
    <button class="theme" data-theme="${t}" data-on="${S.themes.has(t)}"
            aria-pressed="${S.themes.has(t)}">
      <span class="sw" style="--c:${CSSV[t]}"></span>
      <span>${THEME_LABEL[t]}</span>
      <span class="n">${F.themeCounts[t] || 0}</span>
    </button>`).join('');
}

function renderLens() {
  const sel = document.getElementById('lens');
  if (sel.dataset.built) return;
  sel.dataset.built = '1';
  const opts = ['<option value="">Every edition</option>'];
  for (const l of LANGS.slice(0, 16))
    opts.push(`<option value="not:${l}">Missing from ${l}.wikipedia</option>`);
  for (const l of LANGS.slice(0, 16))
    opts.push(`<option value="only:${l}">Present in ${l}.wikipedia</option>`);
  sel.innerHTML = opts.join('');
}

/* ============================================================================
   SEARCH

   Tens of thousands of events and, until now, no way to reach one you already
   knew about. You could only browse.

   No index. A linear scan over the name column with indexOf is roughly a
   millisecond at this corpus size, which is well under the 90 ms debounce, and
   an inverted index would be a data structure to keep correct in exchange for
   nothing a user could perceive. If the corpus grows by another order of
   magnitude this is the first thing to revisit.

   Ranking is prefix, then word-start, then substring, then coverage - so typing
   "roma" gives Rome before Romanshorn, and "cathedral" gives the ones the world
   has actually heard of first.
   ========================================================================== */

const NAME_LC = new Array(NEV);
for (let i = 0; i < NEV; i++) NAME_LC[i] = EV[i].n.toLowerCase();

function searchEvents(qs, limit) {
  const s = qs.trim().toLowerCase();
  if (s.length < 2) return [];
  const hits = [];
  for (let i = 0; i < NEV; i++) {
    const k = NAME_LC[i].indexOf(s);
    if (k < 0) continue;
    const rank = k === 0 ? 3 : /[\s(,'\-]/.test(NAME_LC[i][k - 1]) ? 2 : 1;
    hits.push({ i, rank, sl: EVSL[i] });
  }
  hits.sort((a, b) => b.rank - a.rank || b.sl - a.sl);
  return hits.slice(0, limit || 10);
}

const elSearch = document.getElementById('search');
const elResults = document.getElementById('results');
const elSearchNote = document.getElementById('search-note');
let SR = { hits: [], cursor: -1, total: 0 };

function hilite(label, s) {
  const i = label.toLowerCase().indexOf(s.toLowerCase());
  if (i < 0) return esc(label);
  return esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + s.length)) +
    '</mark>' + esc(label.slice(i + s.length));
}

function renderResults() {
  const s = elSearch.value.trim();
  elResults.innerHTML = SR.hits.map((h, k) => {
    const e = EV[h.i];
    return `<li role="option" id="sr-${k}" data-i="${h.i}" aria-selected="${k === SR.cursor}">` +
      `<span class="nm">${hilite(e.n, s)}</span>` +
      `<span class="when">${fmtYear(e.y)} &middot; ${e.sl}</span></li>`;
  }).join('');
  elSearch.setAttribute('aria-expanded', String(SR.hits.length > 0));
  elSearch.setAttribute('aria-activedescendant', SR.cursor >= 0 ? `sr-${SR.cursor}` : '');
  elSearchNote.textContent = !s || s.length < 2 ? ''
    : !SR.hits.length ? 'nothing in the corpus matches'
    : SR.total > SR.hits.length ? `showing ${SR.hits.length} of ${SR.total} matches`
    : '';
}

function closeResults() {
  SR = { hits: [], cursor: -1, total: 0 };
  elResults.innerHTML = '';
  elSearch.setAttribute('aria-expanded', 'false');
  elSearchNote.textContent = '';
}

/* Turning up at the right place is not enough: a result can be invisible under
   the current coverage floor, outside the time window, or in a theme that has
   been switched off. Choosing it opens whatever is in the way. */
function chooseEvent(i) {
  const e = EV[i];
  if (!e) return;
  if (e.sl < S.kt) S.kt = Math.max(1, e.sl);
  if (!S.themes.has(e.theme)) S.themes.add(e.theme);
  if (S.lens) {
    const [mode, lang] = S.lens.split(':');
    const has = (e.m & LANG_BIT[lang]) !== 0;
    if ((mode === 'only' && !has) || (mode === 'not' && has)) {
      S.lens = '';
      const sel = document.getElementById('lens');
      if (sel) sel.value = '';
    }
  }
  if (e.t < S.win.t0 || e.t > S.win.t1) {
    S.win.t0 = 0;
    S.win.t1 = Math.max(120, Math.min(T_MAX, e.t * 1.8 + 60));
  }
  flyToEvent(i);
  closeResults();
  elSearch.blur();
}

let searchTimer = null;
elSearch.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const s = elSearch.value.trim().toLowerCase();
    const all = searchEvents(elSearch.value, 10);
    SR = { hits: all, cursor: -1, total: s.length < 2 ? 0 : countMatches(s) };
    renderResults();
  }, 90);
});

function countMatches(s) {
  let n = 0;
  for (let i = 0; i < NEV; i++) if (NAME_LC[i].indexOf(s) >= 0) n++;
  return n;
}

elSearch.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const n = SR.hits.length;
    if (!n) return;
    SR.cursor = e.key === 'ArrowDown'
      ? (SR.cursor >= n - 1 ? 0 : SR.cursor + 1)
      : (SR.cursor <= 0 ? n - 1 : SR.cursor - 1);
    renderResults();
    const el = document.getElementById('sr-' + SR.cursor);
    if (el) el.scrollIntoView({ block: 'nearest' });
    e.preventDefault();
  } else if (e.key === 'Enter') {
    const h = SR.hits[SR.cursor >= 0 ? SR.cursor : 0];
    if (h) chooseEvent(h.i);
    e.preventDefault();
  } else if (e.key === 'Escape') {
    if (SR.hits.length) closeResults(); else { elSearch.value = ''; elSearch.blur(); }
    e.stopPropagation();
  }
});

elResults.addEventListener('click', e => {
  const li = e.target.closest('li[data-i]');
  if (li) chooseEvent(+li.dataset.i);
});

/* "/" focuses search from anywhere, unless the user is already typing. */
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  elSearch.focus(); elSearch.select();
  e.preventDefault();
});

document.addEventListener('click', e => {
  if (!e.target.closest('#search, #results')) closeResults();
});

/* ============================================================================
   THE VIEW IN THE URL

   Where you are on the globe, how far back the window reaches, how much of the
   world has to remember something before it appears, which themes are on and
   which language lens is applied - all of it is a point in a small state space,
   and until now none of it left the tab.

   Two rules:

   1. A malformed hash must never stop the page. Every value is parsed
      defensively, clamped to its own range, and checked against the data before
      it is applied. The whole read is wrapped and returns false on failure. A
      URL is user input from a stranger.

   2. history.replaceState throws in a sandboxed iframe with an opaque origin,
      which is where this page is often embedded. Not worth breaking a working
      page over: the failure is swallowed and there is simply no shareable URL
      in that context.
   ========================================================================== */

let hashTimer = null;
let hashSelf = '';

function encodeHash() {
  const p = [];
  p.push('c=' + S.kt);
  p.push('t=' + Math.round(S.win.t0) + '_' + Math.round(S.win.t1));
  p.push('r=' + S.rot.lam.toFixed(1) + ',' + S.rot.phi.toFixed(1));
  p.push('z=' + ZOOMF.toFixed(2));
  if (S.selection) p.push('s=' + S.selection);
  const off = THEMES.filter(t => !S.themes.has(t));
  if (off.length) p.push('th=' + off.join('.'));
  if (S.lens) p.push('l=' + S.lens);
  if (!S.cluster) p.push('cl=0');
  if (S.basemap !== 'satellite') p.push('b=' + S.basemap);
  if (S.showPlates) p.push('p=1');
  return '#' + p.join('&');
}

function writeHash(now) {
  clearTimeout(hashTimer);
  const put = () => {
    const h = encodeHash();
    if (h === location.hash) return;
    hashSelf = h;
    try { history.replaceState(null, '', h); } catch (_) { /* opaque origin; carry on */ }
  };
  // Dragging changes the rotation sixty times a second; the URL settles when the
  // gesture does.
  if (now) put(); else hashTimer = setTimeout(put, 400);
}

function readHash() {
  try {
    const raw = (location.hash || '').replace(/^#/, '');
    if (!raw) return false;
    const p = {};
    for (const kv of raw.split('&')) {
      const i = kv.indexOf('=');
      if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    }
    const num = (v, lo, hi, d) => {
      const n = parseFloat(v);
      return isFinite(n) ? Math.max(lo, Math.min(hi, n)) : d;
    };

    S.kt = Math.round(num(p.c, 1, MAX_SL, S.kt));
    if (p.t) {
      const [a, b] = p.t.split('_');
      const t0 = num(a, 0, T_MAX, S.win.t0), t1 = num(b, 0, T_MAX, S.win.t1);
      if (t1 - t0 >= 20) { S.win.t0 = t0; S.win.t1 = t1; }
    }
    if (p.r) {
      const [a, b] = p.r.split(',');
      S.rot.lam = num(a, -100000, 100000, S.rot.lam);
      S.rot.phi = num(b, -89, 89, S.rot.phi);
    }
    if (p.z) ZOOMF = num(p.z, ZMIN, ZMAX, ZOOMF);
    if (p.s && BY_Q[p.s]) S.selection = p.s;
    if (p.th) {
      const off = new Set(p.th.split('.').filter(t => THEMES.includes(t)));
      // All themes off is an empty globe that reads as a broken page.
      if (off.size < THEMES.length) S.themes = new Set(THEMES.filter(t => !off.has(t)));
    }
    if (p.l) {
      const [mode, lang] = p.l.split(':');
      if ((mode === 'only' || mode === 'not') && LANG_BIT[lang]) S.lens = p.l;
    }
    if (p.cl === '0') S.cluster = false;
    if (p.b === 'chart' || p.b === 'satellite') S.basemap = p.b;
    if (p.p === '1') S.showPlates = true;
    return true;
  } catch (err) {
    console.warn('unreadable view in the URL; using defaults', err);
    return false;
  }
}

/** Controls whose pressed state lives in the DOM rather than in a render pass. */
function syncControls() {
  const set = (id, on, text) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.setAttribute('aria-pressed', String(on));
    if (text) el.textContent = text;
  };
  set('btn-cluster', S.cluster);
  set('btn-basemap', S.basemap === 'satellite', S.basemap === 'satellite' ? 'Satellite' : 'Chart');
  set('btn-plates', S.showPlates);
  const lens = document.getElementById('lens');
  if (lens) lens.value = S.lens;
}

window.addEventListener('hashchange', () => {
  if (location.hash === hashSelf) return;
  if (!readHash()) return;
  renderLens();                 // the lens options must exist before value= sticks
  syncControls();
  resizeGlobe();
  SURF.key = '';
  changed();
});

/* ============================================================================
   WIRING
   ========================================================================== */
let needGlobe = true, needChron = true, needRail = true, needPanel = true;
function markAll() { needGlobe = needChron = needRail = needPanel = true; }
function changed() { invalidate(); markAll(); paintOnInput(); writeHash(); }

function setCoverage(n) {
  const v = Math.max(1, Math.min(MAX_SL, Math.round(n)));
  if (v === S.kt) return;
  S.kt = v; changed();
}
function setWindow(t0, t1) {
  const span = Math.max(20, Math.min(T_MAX, t1 - t0));
  let a = Math.max(0, t0), b = a + span;
  if (b > T_MAX) { b = T_MAX; a = Math.max(0, b - span); }
  S.win.t0 = a; S.win.t1 = b; changed();
}
function setSelection(qid) { S.selection = qid; changed(); }

/* -------------------------------------------------------------------- globe */
let gDrag = null, gMoved = 0;
const gVel = [];

/* One clamp for the zoom, in one place. The wheel, the keyboard and the pinch
   were otherwise each carrying their own copy of the same two magic numbers. */
const ZMIN = 0.45, ZMAX = 4.5;
function setZoom(z) {
  const n = Math.max(ZMIN, Math.min(ZMAX, z));
  if (n === ZOOMF) return false;
  ZOOMF = n; resizeGlobe(); needGlobe = true;
  return true;
}

/* Two-finger zoom.
 *
 * touch-action:none already routes touches here as pointer events, so one finger
 * has always dragged; there was simply nothing listening for a second. Keep the
 * set of live pointers and treat "two or more down" as the pinch state.
 *
 * The baseline is re-established whenever the set changes - a finger added, one
 * lifted, a third landing - because otherwise the distance ratio is measured
 * against a pair that no longer exists and the globe jumps. */
const PTRS = new Map();
let pinch = null;

function pinchState() {
  const it = PTRS.values();
  const a = it.next().value, b = it.next().value;
  if (!a || !b) return null;
  return { d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
           mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}
function rebasePinch() {
  const s = pinchState();
  pinch = s ? { d0: s.d, z0: ZOOMF, mx: s.mx, my: s.my } : null;
}

gcv.addEventListener('pointerdown', e => {
  try { gcv.setPointerCapture(e.pointerId); } catch (_) { /* drag works without it */ }
  // A primary pointerdown means a gesture is starting with nothing else held, so
  // it is also the moment to forget any pointer whose "up" we never received.
  if (e.isPrimary) { PTRS.clear(); pinch = null; }
  PTRS.set(e.pointerId, { x: e.clientX, y: e.clientY });
  S.spin.lam = S.spin.phi = 0;
  gVel.length = 0;
  gcv.classList.add('dragging');
  if (PTRS.size >= 2) {
    gDrag = null;            // a pinch is not a drag...
    gMoved = 999;            // ...and must not land as a click when it ends
    rebasePinch();
    return;
  }
  gDrag = { x: e.clientX, y: e.clientY };
  gMoved = 0;
});
gcv.addEventListener('pointermove', e => {
  if (PTRS.has(e.pointerId)) PTRS.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && PTRS.size >= 2) {
    const s = pinchState();
    if (s) {
      setZoom(pinch.z0 * (s.d / pinch.d0));
      const k = 180 / (GR * Math.PI) * 1.1;
      S.rot.lam += (s.mx - pinch.mx) * k;
      S.rot.phi = Math.max(-89, Math.min(89, S.rot.phi + (s.my - pinch.my) * k));
      pinch.mx = s.mx; pinch.my = s.my;
      needGlobe = true; paintOnInput();
    }
    return;
  }
  const rect = gcv.getBoundingClientRect();
  if (gDrag) {
    const dx = e.clientX - gDrag.x, dy = e.clientY - gDrag.y;
    gMoved += Math.abs(dx) + Math.abs(dy);
    const k = 180 / (GR * Math.PI) * 1.1;
    S.rot.lam += dx * k;
    S.rot.phi = Math.max(-89, Math.min(89, S.rot.phi + dy * k));
    gVel.push({ dx, dy, t: performance.now() });
    if (gVel.length > 5) gVel.shift();
    gDrag = { x: e.clientX, y: e.clientY };
    needGlobe = true; paintOnInput();
    return;
  }
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const best = hitTest(mx, my);
  const id = best ? best.id : null;
  if (id !== S.hover) { S.hover = id; needGlobe = true; paintOnInput(); }
  const tip = document.getElementById('tip');
  if (id && BY_Q[id]) {
    const ev = BY_Q[id];
    tip.innerHTML = `<span class="t">${esc(ev.n)}</span><span class="d">${fmtYear(ev.y)} · ${ev.sl} langs${
      best.n > 1 ? ` · +${best.n - 1} more here` : ''}</span>`;
    tip.style.left = best.x + 'px'; tip.style.top = best.y + 'px';
    tip.classList.add('on'); gcv.style.cursor = 'pointer';
  } else { tip.classList.remove('on'); gcv.style.cursor = ''; }
});
function endGlobeDrag(e) {
  if (!gDrag) return;
  gDrag = null; gcv.classList.remove('dragging');
  if (!RM.matches && gVel.length) {
    const now = performance.now();
    const recent = gVel.filter(v => now - v.t < 90);
    if (recent.length) {
      const k = 180 / (GR * Math.PI) * 1.1;
      S.spin.lam = recent.reduce((a, v) => a + v.dx, 0) / recent.length * k * 0.9;
      S.spin.phi = recent.reduce((a, v) => a + v.dy, 0) / recent.length * k * 0.9;
    }
  }
  if (gMoved < 5) {
    const rect = gcv.getBoundingClientRect();
    const best = hitTest(e.clientX - rect.left, e.clientY - rect.top);
    setSelection(best ? best.id : null);
  }
}
/* Lifting a finger mid-pinch must not end the gesture, and must not be read as a
   click. Only the last one up is a real pointerup. */
gcv.addEventListener('pointerup', e => {
  PTRS.delete(e.pointerId);
  if (PTRS.size >= 2) { rebasePinch(); return; }
  pinch = null;
  if (PTRS.size === 1) {
    const p = PTRS.values().next().value;
    gDrag = { x: p.x, y: p.y };                        // hand back without a jump
    gMoved = 999; gVel.length = 0;
    return;
  }
  endGlobeDrag(e);
});
gcv.addEventListener('pointercancel', e => {
  PTRS.delete(e.pointerId);
  if (PTRS.size < 2) pinch = null;
  if (!PTRS.size) { gDrag = null; gcv.classList.remove('dragging'); }
});
gcv.addEventListener('wheel', e => {
  e.preventDefault();
  setZoom(ZOOMF * (e.deltaY > 0 ? 0.92 : 1.087));
  paintOnInput();
}, { passive: false });
gcv.addEventListener('keydown', e => {
  const step = e.shiftKey ? 15 : 5;
  if (e.key === 'ArrowLeft') S.rot.lam -= step;
  else if (e.key === 'ArrowRight') S.rot.lam += step;
  else if (e.key === 'ArrowUp') S.rot.phi = Math.min(89, S.rot.phi + step);
  else if (e.key === 'ArrowDown') S.rot.phi = Math.max(-89, S.rot.phi - step);
  else if (e.key === '+' || e.key === '=') setZoom(ZOOMF * 1.12);
  else if (e.key === '-') setZoom(ZOOMF * 0.89);
  else if (e.key === 'Escape') { setSelection(null); return e.preventDefault(); }
  else return;
  needGlobe = true; paintOnInput(); e.preventDefault();
});

/* -------------------------------------------------------------------- chron */
let cDrag = null;
const chronPos = e => { const r = ccv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
ccv.addEventListener('pointerdown', e => {
  ccv.setPointerCapture(e.pointerId);
  cDrag = { x: chronPos(e).x, t0: S.win.t0, t1: S.win.t1 };
});
ccv.addEventListener('pointermove', e => {
  if (!cDrag) return;
  const p = chronPos(e);
  const k = Math.max((cDrag.t1 - cDrag.t0) / 46, 1e-9);
  const u0 = Math.asinh(cDrag.t0 / k), u1 = Math.asinh(cDrag.t1 / k);
  const shift = ((p.x - cDrag.x) / CW) * (u1 - u0);
  let a = k * Math.sinh(u0 + shift), b = k * Math.sinh(u1 + shift);
  if (a < 0) { b -= a; a = 0; }
  if (b > T_MAX) { a -= (b - T_MAX); b = T_MAX; a = Math.max(0, a); }
  setWindow(a, b);
});
ccv.addEventListener('pointerup', () => { cDrag = null; });
ccv.addEventListener('pointercancel', () => { cDrag = null; });
ccv.addEventListener('wheel', e => {
  e.preventDefault();
  const sc = SCALE || chronScale();
  const tp = Math.max(0, sc.t(chronPos(e).x));
  const f = e.deltaY > 0 ? 1.16 : 0.862;
  const k = Math.max((S.win.t1 - S.win.t0) / 46, 1e-9);
  const up = Math.asinh(tp / k);
  const u0 = Math.asinh(S.win.t0 / k), u1 = Math.asinh(S.win.t1 / k);
  setWindow(Math.max(0, k * Math.sinh(up + (u0 - up) * f)),
            Math.min(T_MAX, k * Math.sinh(up + (u1 - up) * f)));
}, { passive: false });
document.getElementById('presets').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setWindow(+b.dataset.t0, +b.dataset.t1);
});

/* --------------------------------------------------------------------- rail */
let rDrag = false;
const railSet = e => { const r = rcv.getBoundingClientRect(); setCoverage(yToSl(e.clientY - r.top)); };
rcv.addEventListener('pointerdown', e => { rcv.setPointerCapture(e.pointerId); rDrag = true; railSet(e); });
rcv.addEventListener('pointermove', e => { if (rDrag) railSet(e); });
rcv.addEventListener('pointerup', () => { rDrag = false; });
rcv.addEventListener('pointercancel', () => { rDrag = false; });
rcv.addEventListener('keydown', e => {
  const f = e.shiftKey ? 1.6 : 1.15;
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') setCoverage(Math.max(S.kt + 1, S.kt * f));
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') setCoverage(Math.min(S.kt - 1, S.kt / f));
  else if (e.key === 'Home') setCoverage(1);
  else if (e.key === 'End') setCoverage(MAX_SL);
  else return;
  e.preventDefault();
});
document.getElementById('btn-allcov').addEventListener('click', () => setCoverage(1));

/* ----------------------------------------------------------------- controls */
document.getElementById('themes').addEventListener('click', e => {
  const b = e.target.closest('.theme'); if (!b) return;
  const t = b.dataset.theme;
  if (S.themes.has(t)) S.themes.delete(t); else S.themes.add(t);
  if (!S.themes.size) S.themes = new Set(THEMES);
  changed();
});
document.getElementById('lens').addEventListener('change', e => { S.lens = e.target.value; changed(); });
elDetail.addEventListener('click', e => {
  const b = e.target.closest('[data-q]'); if (!b) return;
  setSelection(b.dataset.q); elDetail.scrollTop = 0;
});
document.getElementById('btn-cluster').addEventListener('click', e => {
  S.cluster = !S.cluster;
  e.currentTarget.setAttribute('aria-pressed', String(S.cluster));
  needGlobe = true; paintOnInput();
});
document.getElementById('btn-basemap').addEventListener('click', e => {
  S.basemap = S.basemap === 'satellite' ? 'chart' : 'satellite';
  const sat = S.basemap === 'satellite';
  e.currentTarget.setAttribute('aria-pressed', String(sat));
  e.currentTarget.textContent = sat ? 'Satellite' : 'Chart';
  needGlobe = true; paintOnInput();
});
document.getElementById('btn-plates').addEventListener('click', e => {
  S.showPlates = !S.showPlates;
  e.currentTarget.setAttribute('aria-pressed', String(S.showPlates));
  needGlobe = true; paintOnInput();
});
document.getElementById('btn-theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  readPalette(); SURF.key = ''; markAll(); paintOnInput();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  readPalette(); SURF.key = ''; markAll(); paintOnInput();
});

/* ---------------------------------------------------------------- rendering */
/* render(dt) does the work, frame(now) only schedules it, and paintOnInput
   paints straight from the handler when rAF is not running — which it is not in
   a document whose visibilityState is "hidden". Learned on the sibling site,
   where the whole UI drew from inside the rAF callback and therefore never
   appeared at all in that case. */
let last = performance.now(), lastPaint = 0, lastRafAt = -1e9, painting = false;

/* -------------------------------------------------------------- flying there
   A search result three quarters of the way round the globe is not much use if
   it simply appears behind you. The shortest way round is chosen by unwrapping
   the target longitude to within 180 degrees of where we are, so the globe never
   spins the long way for the sake of arithmetic. */
let TW = null;
function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function flyToEvent(i) {
  const e = EV[i];
  if (!e) return;
  let lam = -e.lng;
  while (lam - S.rot.lam > 180) lam -= 360;
  while (lam - S.rot.lam < -180) lam += 360;
  S.spin.lam = S.spin.phi = 0;
  TW = {
    t: 0, dur: RM.matches ? 0.01 : 0.9,
    from: { lam: S.rot.lam, phi: S.rot.phi },
    to: { lam, phi: Math.max(-70, Math.min(70, e.lat)) }
  };
  setSelection(e.q);
}

function render(dt) {
  lastPaint = performance.now();
  sizeGuard();

  if (TW) {
    TW.t += dt;
    const p = Math.min(1, TW.t / TW.dur), k = ease(p);
    S.rot.lam = TW.from.lam + (TW.to.lam - TW.from.lam) * k;
    S.rot.phi = TW.from.phi + (TW.to.phi - TW.from.phi) * k;
    needGlobe = true;
    if (p >= 1) TW = null;
  }

  if ((S.spin.lam || S.spin.phi) && !gDrag) {
    S.rot.lam += S.spin.lam;
    S.rot.phi = Math.max(-89, Math.min(89, S.rot.phi + S.spin.phi));
    S.spin.lam *= 0.94; S.spin.phi *= 0.94;
    if (Math.abs(S.spin.lam) < 0.008 && Math.abs(S.spin.phi) < 0.008) S.spin.lam = S.spin.phi = 0;
    needGlobe = true;
  }

  if (needGlobe) { drawGlobe(dt); needGlobe = false; }
  if (needChron) { drawChron(); needChron = false; }
  if (needRail) { drawRail(); needRail = false; }
  if (needPanel) {
    const F = q();
    renderDetail(); renderThemes(); renderLens();
    document.getElementById('hdr-count').textContent = EV.length.toLocaleString();
    document.getElementById('hd-cov').textContent = S.kt;
    document.getElementById('hd-n').textContent = F.events.length.toLocaleString();
    document.getElementById('rail-n').textContent = S.kt + '+';
    const span = S.win.t1 - S.win.t0;
    document.getElementById('rd-window').textContent =
      S.win.t1 >= T_MAX * 0.99 ? 'all 75,000 years'
        : `${fmtYbpLabel(S.win.t1)} to ${fmtYbpLabel(S.win.t0)}`;
    const dropped = F.inWindow - F.events.length;
    document.getElementById('rd-drop').innerHTML = dropped > 0
      ? `<b>${dropped.toLocaleString()}</b> hidden by coverage, theme or lens`
      : '';
    document.getElementById('hd-sub').textContent =
      S.lens ? `${F.lensDropped.toLocaleString()} events in this window fail the language filter.`
        : `${F.belowCoverage.toLocaleString()} events in this window are remembered in fewer than ${S.kt} editions.`;
    document.getElementById('lens-hint').textContent = S.lens
      ? 'Filtering by which Wikipedia edition carries an article. Absence is a fact about the record, not about history.'
      : 'Pick an edition to see what it does — or does not — cover.';
    rcv.setAttribute('aria-valuenow', S.kt);
    ccv.setAttribute('aria-valuenow', Math.round(S.win.t1));
    needPanel = false;
  }
}
function frame(now) {
  lastRafAt = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { render(dt); } catch (err) { console.error('render failed', err); }
  requestAnimationFrame(frame);
}
function renderNow() {
  last = performance.now();
  try { render(0.016); } catch (err) { console.error('render failed', err); }
}
/* Has the animation loop actually run lately?
   The old test asked whether a frame had been *requested*, which is true forever
   after the first one — rAF stops firing but the flag never clears — while
   lastPaint keeps being refreshed by the watchdog. So the guard read as "rAF is
   alive" permanently and paintOnInput returned early on every input, dropping
   26 of 36 moves in a drag. Ask when a frame last ran instead. */
function rafIsLive() { return performance.now() - lastRafAt < 120; }

/* Paint on every input event. No time throttle.

   A throttle needs a trailing timer to make up the frames it skips, and in a
   document whose visibilityState is hidden — the case that made painting from
   input necessary in the first place — chained timers are clamped to about 1Hz.
   So the throttle dropped three quarters of a drag and the recovery never came:
   36 pointer moves produced 9 paints.

   There is no need for one. A paint costs ~1ms on a cache hit and a few ms on a
   miss, the adaptive scale keeps it there, the re-entrancy guard stops overlap,
   and the event loop cannot deliver the next move until this handler returns —
   so the input rate is self-limiting. Sharpening is still deferred, because that
   frame is expensive and belongs in the quiet after the gesture. */
let sharpen = null;

function scheduleSharpen() {
  if (sharpen) clearTimeout(sharpen);
  sharpen = setTimeout(() => {
    sharpen = null;
    needGlobe = true;
    renderNow();                 // one crisp frame, once the hands have stopped
  }, 190);
}

function paintOnInput() {
  LAST_INPUT_AT = performance.now();
  lastInteraction = LAST_INPUT_AT;
  scheduleSharpen();
  writeHash();                    // debounced; the URL settles when the gesture does
  if (painting || rafIsLive()) return;
  painting = true;
  try { renderNow(); } finally { painting = false; }
}


/* ------------------------------------------------------- the animation clock

   Measured in a document whose visibilityState is "hidden":

       requestAnimationFrame        0 Hz   (never fires)
       main-thread setInterval(16)  1.3 Hz (clamped by intensive throttling)
       Worker setInterval(16)      61.7 Hz (not throttled)

   Input already paints itself, so dragging is smooth regardless. But anything
   that animates on its own — the travelling dots along causal arcs, the pulse
   on planet-wide facts, the inertia after a flick, Replay sweeping the
   knowledge rail — has no clock at all, and ran at the watchdog's 1.3 Hz.

   A dedicated worker's timer is exempt from that throttling, so one posts a
   tick and the main thread renders on it. MessageChannel also escapes the
   clamp, at 330,000 Hz, but that is a busy-spin rather than a clock.

   The beat stands down the moment rAF starts working, so a normal foreground
   tab is driven by rAF exactly as before, and it stops rendering after two
   minutes without input so a genuinely backgrounded tab is not animated for
   nobody. If the host's CSP forbids blob workers it degrades to what we had. */
let beat = null;
let lastInteraction = performance.now();
const BEAT_IDLE_MS = 120000;

function isAnimating() {
  if (RM.matches) return false;
  if (TW) return true;                                    // flying to a search hit
  if (Math.abs(S.spin.lam) > 0.008 || Math.abs(S.spin.phi) > 0.008) return true;
  return false;
}

function onBeat() {
  if (rafIsLive()) return;                       // the real loop is back
  if (performance.now() - lastInteraction > BEAT_IDLE_MS) return;
  const dirty = needGlobe || needChron || needRail || needPanel;
  if (!dirty && !isAnimating()) return;
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (isAnimating()) needGlobe = true;           // arcs and spin repaint the globe
  try { render(dt); } catch (err) { console.error('render failed', err); }
}

function startHeartbeat() {
  if (beat) return;
  try {
    const url = URL.createObjectURL(new Blob(
      ['setInterval(function(){postMessage(0)},16);'], { type: 'text/javascript' }));
    beat = new Worker(url);
    URL.revokeObjectURL(url);
    beat.onmessage = onBeat;
  } catch (_) {
    beat = null;                                  // CSP may forbid it; carry on
  }
}

setInterval(() => {
  if (performance.now() - lastPaint > 400 &&
      (needGlobe || needChron || needRail || needPanel)) renderNow();
}, 250);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { markAll(); renderNow(); }
});

function boot() {
  readPalette();
  readHash();                     // a shared view wins over the defaults...
  renderLens();                   // ...and the lens needs its options before value= sticks
  syncControls();                 // ...and the controls have to say so
  resizeGlobe(); resizeChron(); resizeRail();
  changed();
  renderNow();
  requestAnimationFrame(frame);
  startHeartbeat();
  window.__BOOT_OK = true;
}

/* The sibling site lost an entire build to a boot() that threw one line before
   requestAnimationFrame(frame) — a cosmetic swatch colour killed the render loop,
   and nothing detected it because the page still drew, once, off a watchdog. The
   loop must start even if setup fails, and the flags are what lets
   tools/smoke_test.py ask from outside whether boot actually ran. */
function safeBoot() {
  window.__BOOT_OK = false;
  window.__BOOT_ERR = null;
  try { boot(); }
  catch (err) {
    window.__BOOT_ERR = String((err && err.stack) || err);
    console.error('boot failed; starting the render loop anyway', err);
    try { markAll(); renderNow(); } catch (_) {}
    requestAnimationFrame(frame);
    startHeartbeat();
  }
}
const ro = new ResizeObserver(() => { resizeGlobe(); resizeChron(); resizeRail(); markAll(); renderNow(); });
ro.observe(document.getElementById('stage'));
ro.observe(document.querySelector('.chron'));
ro.observe(document.querySelector('.rail'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { markAll(); renderNow(); });
safeBoot();

</script>
</body>
</html>
